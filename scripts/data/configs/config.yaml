defaults:
  - initial_condition: grf
  - pde: cubic_1d
  - backend: default
  - override hydra/launcher: submitit_slurm

hydra:
  launcher: 
    timeout_min: 900
    tasks_per_node: 1
    gpus_per_node: 1


n_coeffs: 100
n_ics_per_coeff: 100
coeff_sampling_strategy: uniform

seed: 0
dataset_type: "train"

savedir: ./data/datasets
savename: ${.pde.name}_${.initial_condition.name}_seed=${.seed}.zarr
bc: periodic   # or a list of [lower, upper] pairs per axis: [[extrap, extrap]]

gpu_id: "auto" # or integer