name: cubic_2d
pde_factory: context_flux_no.simulations.pde.CubicFlux2D

coeff_range_dict:
  a: [-1.0, 1.0]
  b: [-1.0, 1.0]
  c: [-1.0, 1.0]

coeff_sampling_strategy: linspace

# Grid and time keys were missing from this config (it could not run); these mirror euler_2d
# and are to be confirmed against the ICLR cubic-2D data before Phase 4.4 regenerates it.
x_spans: [[0, 1], [0, 1]]
Nxs: [128, 128]
t_span: [0, 0.5]
Nt: 100

solve_kwargs: null
