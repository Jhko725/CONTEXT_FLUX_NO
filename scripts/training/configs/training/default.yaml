# Maybe separate out into loader config?
context_length: 20
batch_size: 256
batches_per_load: 100
queue_capacity: 5

max_steps: 50000

optimizer:
  _target_: optax.adamw
  learning_rate:
    _target_: optax.schedules.warmup_cosine_decay_schedule
    init_value: 0.0
    peak_value: 5e-5
    warmup_steps: 5000
    decay_steps: 45000
    end_value: 0.0
# checkpoints live in the run directory (hydra.run.dir/checkpoints); see training.run.Run
eval_every: 1      # one-batch validation every N steps (the ICLR scripts validated every step)
save_every: 100    # offer the TrainerState to the checkpointer every N steps; the final step is always
                   # saved and the best (by valid_loss) among the saved ones is kept
log_every: 1       # metrics to wandb every N steps
