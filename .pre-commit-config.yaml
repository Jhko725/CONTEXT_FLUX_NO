repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]  # reads [tool.codespell] on Python < 3.11
  - repo: local
    hooks:
      - id: check-spelling
        name: check spelling (-ise families)
        entry: uv run python scripts/check_spelling.py
        language: system
        types_or: [python, markdown, toml, yaml]
      - id: check-docs
        name: check docs bookkeeping
        entry: uv run python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: ^(docs/|CLAUDE\.md)
