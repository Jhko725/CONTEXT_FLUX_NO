[project]
name = "context-flux-no"
version = "0.1.0"
description = "HFluxNO: in-context learning of finite-volume solvers for families of hyperbolic conservation laws (hypernetwork + flux neural operator)"
readme = "README.md"
authors = [
    { name = "Joon-Hyuk Ko", email = "jhko725@kias.re.kr" }
]
requires-python = ">=3.13"
dependencies = [
    "clawpack>=5.12.0",
    "colorcet>=3.1.0",
    "diffrax>=0.7.1",
    "einops>=0.8.1",
    "equinox>=0.12.2",
    "fsspec>=2024.10.0",
    "grain>=0.2.10",
    "gstools>=1.7.0",
    "h5py>=3.14.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "ipykernel>=6.29.5",
    "jax>=0.9.0.1",
    "jaxtyping>=0.3.2",
    "matplotlib>=3.10.3",
    "more-itertools>=10.7.0",
    "nbformat>=5.10.4",
    "numpy>=2.3.0",
    "optax>=0.2.5",
    "orbax-checkpoint>=0.12.8",
    "pandas>=2.2",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tensorstore>=0.1.81",
    "tqdm>=4.67.3",
    "wandb>=0.22.3",
    "zarr>=3.3.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.9.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = []
fix = true
line-length = 88
# legacy/ awaits its rewrite (rule R7). force-exclude makes the exclusion hold for the
# files that a git hook passes explicitly.
extend-exclude = ["src/context_flux_no/legacy", "tests/legacy"]
force-exclude = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
fixable = ["I001", "F401"]
# E501: ruff format governs line length; long strings/comments are allowed.
# F722/F821: jaxtyping shape strings (Float[Array, "channels *grids"]) are not forward references.
ignore = ["E402", "E501", "E721", "E731", "E741", "F722", "F821"]
# Adapted from Jhko725/UniversalForceReconstruction pyproject.toml at b80a341.
# TID251 enforces banned-api below. W605 rejects an invalid escape, such as LaTeX's
# "\Phi" in a docstring that is not raw, which Python only reports as a SyntaxWarning.
# D100-D103 require a docstring on every public module, class, method and function of
# the clean paths. C901 bounds the decision points of one function (`if`, loop,
# `except`, `case`, `and`, `or`).
select = ["E", "F", "W605", "I001", "TID251", "D100", "D101", "D102", "D103", "C901"]

[tool.ruff.lint.mccabe]
# Lower than ruff's default of 10, as in UniversalForceReconstruction, where 8 flags
# every function that its reviews called nested.
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"  # the section parser; only the selected D rules run

[tool.ruff.lint.per-file-ignores]
# The D rules apply to the clean paths only (rule R7): everything outside them is
# exempt. This pattern copies `clean` under [tool.context_flux_no], which ruff cannot
# read.
"!{src/context_flux_no/simulations/**,src/context_flux_no/runs/**,src/context_flux_no/utils/**,src/context_flux_no/data/**,src/context_flux_no/training/**,src/context_flux_no/evaluation/**,src/context_flux_no/experiment.py,src/context_flux_no/custom_types.py,tests/unit/**,tests/verification/**,tests/helpers.py,tests/conftest.py,scripts/**}" = ["D"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Python floor is 3.13 (requires-python): copy.replace is the one way to copy-with-changes.
"dataclasses.replace".msg = "use copy.replace (Python >= 3.13)"

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "hypothesis>=6.100",
    "markdown-it-py>=3.0.0",
    "chex>=0.1.86",
    "prek",
    "rust-just",
    "ty",
    "ruff==0.15.11",
    "juliacall>=0.9.37",
    "juliapkg>=0.1.28",
    "beartype>=0.23.1",
]

[tool.context_flux_no]
# Rule R7: the strict checks apply to these paths. A path that does not exist yet is
# skipped by its readers.
clean = [
    "src/context_flux_no/simulations",
    "src/context_flux_no/runs",
    "src/context_flux_no/utils",
    "src/context_flux_no/data",
    "src/context_flux_no/training",
    "src/context_flux_no/evaluation",
    "src/context_flux_no/experiment.py",
    "src/context_flux_no/custom_types.py",
    "tests/unit",
    "tests/verification",
    "tests/helpers.py",
    "tests/conftest.py",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: verification suite (x64, oracle-based); excluded from the fast tiers",
]
addopts = "-m 'not slow'"

[tool.codespell]
# The irregular British spellings and typos; scripts/checks/check_spelling.py covers the
# productive -ise/-isation/-yse families. Each skipped tree is listed twice: "./x" for
# the root walk CI does, "x/*" for the paths a git hook passes; no single pattern
# covers both. docs/coding-standards.md says why docs/changes is out of scope; the Julia
# Manifest.toml holds Julia package names that are not words.
builtin = "clear,en-GB_to_en-US"
skip = "*.lock,.git,*.npz,*.h5,Manifest.toml,./docs/changes,docs/changes/*,./src/context_flux_no/legacy,src/context_flux_no/legacy/*,./tests/legacy,tests/legacy/*"
ignore-words-list = "Numer,DATAS,IST,nd"
