name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev            # CPU jax; GPU machines use --extra cuda
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/check_docs.py
      # American English: codespell for irregulars and typos (pinned: its word list is
      # what docs/coding-standards.md measured), check_spelling.py for the -ise families.
      - run: uvx codespell@2.4.3
      - run: uv run python scripts/check_spelling.py
      - run: JAX_PLATFORMS=cpu uv run pytest -q
        # pyproject addopts excludes the regression and slow tiers

  # Opt-in (change document 2026-10-25-phase2a-trixi-backend, D-CI): the Julia side of
  # TrixiBackend — Julia install, the committed reference/trixi lock, Pkg.test, V18. Runs on
  # manual dispatch or when the commit message contains "[julia]"; Trixi's precompilation
  # dominates the cold time, so the depot and the install are cached on the lock files.
  julia:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[julia]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            reference/trixi/pyjuliapkg
          key: julia-${{ runner.os }}-${{ hashFiles('reference/trixi/Manifest.toml', 'src/context_flux_no/juliapkg.json', 'uv.lock') }}
      - run: JAX_PLATFORMS=cpu uv run python scripts/setup_julia.py --test
      - run: JAX_PLATFORMS=cpu uv run pytest tests/unit/test_trixi_backend.py tests/verification/test_crosscode.py -m "slow or not slow" -k "trixi or reference_backends or describe"
